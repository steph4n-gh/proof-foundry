name: Optional Frozen-Bounty Auto-Merge (Fork-Safe)

# Hardened split pattern (Opus 5.5 P0 #4):
# - `decide` runs read-only with ZERO secrets and `persist-credentials: false`, NEVER executes Lean
#   or `.mjs` PR files — purely inspects `git diff -z --no-renames --raw` + `JSON.parse` + base state.
# - `merge` has NO checkout and uses GitHub's native `--auto --squash --match-head-commit` so the
#   `main` branch ruleset still enforces `gate` + up-to-date branch!
# - Dormant unless repo variable ENABLE_AUTO_MERGE == 'true'.
on:
  workflow_run:
    workflows: ["Mechanical Judge & Self-Test Gate"]
    types: [completed]

permissions:
  contents: read

jobs:
  decide:
    if: >-
      vars.ENABLE_AUTO_MERGE == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      lemma_id: ${{ steps.check.outputs.lemma_id }}
    steps:
      - name: Checkout trusted main (no credentials persisted)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pure data-only eligibility check (never executes PR files)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUM=$(gh pr list --state open --json number,headRefOid,baseRefName,isDraft --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and .baseRefName == \"main\" and .isDraft == false) | .number" | head -n 1)
          if [ -z "$PR_NUM" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "refs/pull/$PR_NUM/head:pr-head"
          ACTUAL_SHA=$(git rev-parse pr-head)
          if [ "$ACTUAL_SHA" != "$HEAD_SHA" ]; then
            echo "PR head moved ($ACTUAL_SHA != $HEAD_SHA)."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff -z --no-renames --raw "HEAD...pr-head" > "$RUNNER_TEMP/diff.rawz"
          node hub/fleet.mjs decide-auto-merge --git-raw-z "$RUNNER_TEMP/diff.rawz" --ref pr-head > "$RUNNER_TEMP/decide.json"
          cat "$RUNNER_TEMP/decide.json"

          ELIGIBLE=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/decide.json","utf8")); console.log(Boolean(d.eligible));')
          LEMMA=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/decide.json","utf8")); console.log(d.lemma_id || "");')
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "lemma_id=$LEMMA" >> "$GITHUB_OUTPUT"

  merge:
    needs: [decide]
    if: needs.decide.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable native squash auto-merge pinned to exact verified head SHA
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_APP_TOKEN || github.token }}
          PR_NUM: ${{ needs.decide.outputs.pr_number }}
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          LEMMA_ID: ${{ needs.decide.outputs.lemma_id }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUM" --repo "${{ github.repository }}" --auto --squash --match-head-commit "$HEAD_SHA" --subject "proof(auto): merge verified frozen bounty $LEMMA_ID (PR #$PR_NUM)"
