name: Optional Frozen-Bounty Auto-Merge (Fork-Safe)

# Runs ONLY on default branch `main` after the Mechanical Judge finishes,
# and ONLY when repo variable ENABLE_AUTO_MERGE == 'true'.
# Re-verifies the exact PR head SHA from trusted main against frozen statements
# and strict allowlist before merging with --match-head-commit.
on:
  workflow_run:
    workflows: ["Mechanical Judge (Base-Trusted PR Verification)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      vars.ENABLE_AUTO_MERGE == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate matching open PR for exact verified head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUM=$(gh pr list --state open --json number,headRefOid,baseRefName,isDraft --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and .baseRefName == \"main\" and .isDraft == false) | .number" | head -n 1)
          if [ -z "$PR_NUM" ]; then
            echo "No non-draft open PR targeting main matches head SHA $HEAD_SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage allowlisted claim files from PR head onto trusted main
        if: steps.pr.outputs.skip == 'false'
        env:
          PR_NUM: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUM/head:pr-head"
          ACTUAL_SHA=$(git rev-parse pr-head)
          if [ "$ACTUAL_SHA" != "$HEAD_SHA" ]; then
            echo "PR head moved ($ACTUAL_SHA != $HEAD_SHA); aborting auto-merge."
            exit 1
          fi
          git diff --name-only "HEAD...pr-head" > "$RUNNER_TEMP/changed_files.txt"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if echo "$f" | grep -qE '^(missions/[a-z0-9-_]+/(submissions/[A-Za-z0-9_.-]+\.json|artifacts/[A-Za-z0-9_.-]+|lean/[A-Za-z0-9_]+/Claims/[A-Za-z0-9_]+\.lean)|lean/PnP/Lemmas/[A-Za-z0-9_]+\.lean)$'; then
              mkdir -p "$(dirname "$f")"
              git show "pr-head:$f" > "$f"
            fi
          done < "$RUNNER_TEMP/changed_files.txt"

      - name: Install Lean 4 (elan)
        if: steps.pr.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Re-verify from trusted main & require frozen-statement match
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_APP_TOKEN || github.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          node hub/fleet.mjs verify-pr --files-list "$RUNNER_TEMP/changed_files.txt" > "$RUNNER_TEMP/report.json"
          ELIGIBLE=$(node -e 'const r = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/report.json","utf8")); console.log(Boolean(r.ok && r.eligible_for_auto_merge));')
          if [ "$ELIGIBLE" != "true" ]; then
            echo "PR #$PR_NUM passed Judge but is NOT frozen-statement matched (requires cross-model audit before merge)."
            exit 0
          fi
          gh pr merge "$PR_NUM" --squash --match-head-commit "$HEAD_SHA" --subject "proof(auto): merge verified frozen bounty PR #$PR_NUM"
