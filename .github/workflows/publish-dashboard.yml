name: Publish Proof Foundry Dashboard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Optional Frozen-Bounty Auto-Merge (Fork-Safe)"]
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always check out trusted main — never executes PR/fork code!
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Derive live mission state, sync open PR badges & build dist/ + dist/PROOFS.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node hub/build_site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
