name: Publish Proof Foundry Dashboard

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Optional Frozen-Bounty Auto-Merge (Fork-Safe)"]
    types: [completed]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Split build and deploy into separate jobs per GitHub Pages' official architecture:
  # prevents the ~350ms same-job artifact-metadata indexing race ("Found 0 artifact(s)")
  # and keeps `pages: write` / `id-token: write` isolated strictly to the deploy job.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Always check out trusted main — never executes PR/fork code!
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"

      - name: Derive live mission state, sync open PR badges & build dist/ + dist/PROOFS.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: node hub/build_site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static bundle
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
