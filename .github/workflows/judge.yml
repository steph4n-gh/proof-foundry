name: Mechanical Judge & Self-Test Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR Lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.cls.outputs.lane }}
      same_repo: ${{ steps.cls.outputs.same_repo }}
      needs_lean: ${{ steps.cls.outputs.needs_lean }}
      submissions_count: ${{ steps.cls.outputs.submissions_count }}
      frozen_ok: ${{ steps.cls.outputs.frozen_ok }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"

      - name: Classify diff strictly via git raw -z (never executes PR code)
        id: cls
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CUR_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            {
              echo "lane=infra"
              echo "same_repo=true"
              echo "needs_lean=true"
              echo "submissions_count=0"
              echo "frozen_ok=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HEAD_REPO" = "$CUR_REPO" ]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

          git fetch --no-tags origin "$BASE_SHA" "refs/pull/$PR_NUM/head:pr-head"
          if [ "$(git rev-parse pr-head)" != "$HEAD_SHA" ]; then
            echo "PR head moved since this workflow was queued (expected $HEAD_SHA)." >&2
            exit 1
          fi
          git diff -z --no-renames --raw "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/diff.rawz"

          set +e
          node hub/fleet.mjs classify-pr --git-raw-z "$RUNNER_TEMP/diff.rawz" > "$RUNNER_TEMP/classify.json"
          CLS_RC=$?
          set -e
          cat "$RUNNER_TEMP/classify.json"

          LANE=$(node -e 'const c=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/classify.json","utf8")); console.log(c.lane);')
          NEEDS_LEAN=$(node -e 'const c=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/classify.json","utf8")); console.log(Boolean(c.needs_lean));')
          SUBS=$(node -e 'const c=JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/classify.json","utf8")); console.log(c.submissions_count || 0);')

          {
            echo "lane=$LANE"
            echo "needs_lean=$NEEDS_LEAN"
            echo "submissions_count=$SUBS"
            if [ "$CLS_RC" -eq 0 ]; then
              echo "frozen_ok=true"
            else
              echo "frozen_ok=false"
            fi
          } >> "$GITHUB_OUTPUT"

  judge:
    name: Verify Swarm Submission
    needs: [classify]
    if: github.event_name == 'pull_request' && needs.classify.outputs.submissions_count != '0' && (needs.classify.outputs.lane == 'donor' || needs.classify.outputs.same_repo == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base (donor lane) or pinned PR head (same-repo infra lane)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.classify.outputs.lane == 'infra' && needs.classify.outputs.same_repo == 'true' && github.event.pull_request.head.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"

      - name: Compute pinned git raw -z diff and stage allowlisted 100644 files (donor lane)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LANE: ${{ needs.classify.outputs.lane }}
          SAME_REPO: ${{ needs.classify.outputs.same_repo }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "refs/pull/$PR_NUM/head:pr-head"
          if [ "$(git rev-parse pr-head)" != "$HEAD_SHA" ]; then
            echo "PR head moved since this workflow was queued (expected $HEAD_SHA)." >&2
            exit 1
          fi
          git diff -z --no-renames --raw "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/diff.rawz"
          if [ "$LANE" != "infra" ] || [ "$SAME_REPO" != "true" ]; then
            node hub/fleet.mjs stage-pr --git-raw-z "$RUNNER_TEMP/diff.rawz" --ref "$HEAD_SHA"
          fi

      - name: Install Lean 4 (elan) if needed
        if: needs.classify.outputs.needs_lean == 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$RUNNER_TEMP/elan-init.sh" \
            https://raw.githubusercontent.com/leanprover/elan/3cc76985a1becb3c03cd65c1c5007e6f186ae474/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run Trusted Base Mechanical Judge
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          SAME_REPO: ${{ needs.classify.outputs.same_repo }}
        run: |
          set +e
          EXTRA_ARGS=()
          if [ "$LANE" = "infra" ] && [ "$SAME_REPO" = "true" ]; then
            EXTRA_ARGS=(--allow-infra --allow-meta)
          fi
          node hub/fleet.mjs verify-pr --git-raw-z "$RUNNER_TEMP/diff.rawz" "${EXTRA_ARGS[@]}" | tee "$RUNNER_TEMP/judge-report.json"
          STATUS=${PIPESTATUS[0]}
          {
            echo "## Proof Foundry Mechanical Judge Receipt (Base-Trusted)"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/judge-report.json"
            echo '```'
            echo ""
            if [ "$STATUS" -eq 0 ]; then
              echo "**Verdict: PASSED ✓**"
            else
              echo "**Verdict: REJECTED ✕**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  selftest:
    name: Repo Self-Test Suite
    needs: [classify]
    if: needs.classify.outputs.lane == 'infra' && needs.classify.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head (same-repo maintainer PR or push to main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.5"

      - name: Install Lean 4 (elan)
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$RUNNER_TEMP/elan-init.sh" \
            https://raw.githubusercontent.com/leanprover/elan/3cc76985a1becb3c03cd65c1c5007e6f186ae474/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run npm test
        run: npm test

      - name: Setup Java 21 for TLC model checking
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned tla2tools.jar (v1.7.4) with SHA-256 verification
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
          echo "VERIFY_TLA2TOOLS_SHA256=1" >> "$GITHUB_ENV"

      - name: Run full formal verification suite (Lean 4 proofs + differential harnesses + 4 TLC models)
        run: npm run verify:formal -- --require-tlc

  # Single always-running required status check for `main` branch ruleset
  gate:
    name: gate
    needs: [classify, judge, selftest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      LANE: ${{ needs.classify.outputs.lane }}
      SAME_REPO: ${{ needs.classify.outputs.same_repo }}
      SUBS: ${{ needs.classify.outputs.submissions_count }}
      FROZEN_OK: ${{ needs.classify.outputs.frozen_ok }}
      CLS_RES: ${{ needs.classify.result }}
      JUDGE_RES: ${{ needs.judge.result }}
      SELF_RES: ${{ needs.selftest.result }}
    steps:
      - name: Evaluate final gate
        run: |
          set -euo pipefail
          echo "lane=$LANE same_repo=$SAME_REPO subs=$SUBS frozen_ok=$FROZEN_OK classify=$CLS_RES judge=$JUDGE_RES selftest=$SELF_RES"
          if [ "$CLS_RES" != "success" ] || [ "$FROZEN_OK" != "true" ]; then
            echo "FAIL: Classification failed or immutable frozen statement was modified."
            exit 1
          fi
          if [ "$LANE" = "donor" ]; then
            if [ "$JUDGE_RES" = "success" ]; then
              echo "PASS: Donor submission verified by isolated Mechanical Judge."
              exit 0
            fi
            echo "FAIL: Donor submission failed Mechanical Judge ($JUDGE_RES)."
            exit 1
          fi
          # Infra lane
          if [ "$SAME_REPO" != "true" ]; then
            echo "FAIL: Infra/non-allowlist changes from a fork require maintainer adoption."
            exit 1
          fi
          if [ "$SELF_RES" != "success" ]; then
            echo "FAIL: Repo self-test suite failed ($SELF_RES)."
            exit 1
          fi
          if [ "$SUBS" != "0" ] && [ "$JUDGE_RES" != "success" ]; then
            echo "FAIL: Submissions in maintainer PR failed Judge ($JUDGE_RES)."
            exit 1
          fi
          echo "PASS: Maintainer infra check passed."
